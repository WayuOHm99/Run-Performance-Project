# ธีมแดชบอร์ด — ตั้งเป็น "สว่าง" ถาวร (ไม่ตามธีมมืดของ OS/เบราว์เซอร์)
# เหตุผล: ตาราง st.dataframe วาดบน <canvas> ตามสีธีม ถ้าเป็นธีมมืดจะพิมพ์ออกมาพื้นมืด/ตัวจาง
# แก้ด้วย print CSS ไม่ได้ (แก้พิกเซลใน canvas ไม่ได้) — พื้นขาวจึงพิมพ์สะอาดทั้งตารางและกราฟ
[theme]
base = "light"
primaryColor = "#2a78d6"
textColor = "#31333F"

# --- ระบบดีไซน์ของใบงาน #18 (25 ส.ค. 69) ---
# ฟอนต์ตัวเดียวรองรับทั้งไทยและอังกฤษ ตัวเลขใช้ mono เพื่อให้เรียงตรงคอลัมน์ในตาราง
font = "IBM Plex Sans Thai"
headingFont = "IBM Plex Sans Thai"
codeFont = "IBM Plex Mono"

# มุม 2 px ทั้งระบบ — คมแบบเครื่องมือ ไม่ใช่การ์ดมนซึ่งเป็นค่าเริ่มต้นที่ดูเหมือนกันไปหมด
baseRadius = "2px"
borderColor = "#e4e1da"

# สีกราฟ: น้ำเงิน↔ส้มผ่านการตรวจตาบอดสีแล้ว (ΔE 24.7) ตรงกับ C_BLUE / C_SECOND
# ใน dashboard.py  สองบรรทัดนี้ Streamlit ส่งไปให้ฝั่งหน้าเว็บทาทับกราฟที่ใช้ theme="streamlit"
# **แต่ตัวที่ตัดสินสีจริงในโปรเจกต์นี้คือ `colorway` ของ plotly template ใน dashboard.py**
# เพราะไฟล์นั้นตั้ง `pio.templates.default` ทับ template ของ Streamlit ไปแล้ว — ค่าที่นี่
# จึงเป็นตาข่ายรองสำหรับกราฟชนิดอื่น (st.line_chart / altair) ไม่ใช่ที่เดียวที่ต้องแก้
# สองสีท้ายเลี่ยงเขียว/เหลืองเพราะมันคือสีสถานะ ซึ่งจองไว้ให้สถานะอย่างเดียว
chartCategoricalColors = ["#2a78d6", "#eb6834", "#104281", "#86b6ef"]
chartSequentialColors = ["#cde2fb", "#9ec5f4", "#6da7ec", "#3987e5", "#2a78d6", "#1c5cab", "#104281"]

# ตัวเลขใน st.metric ของแท็บที่ยังไม่ได้รื้อ (การฟื้นตัว/การซ้อม/ความก้าวหน้า/เซสชัน)
# ค่าเริ่มต้นของ Streamlit ใหญ่เท่าตัวเลขคำตัดสิน ทำให้ค่าประกอบดังเท่าตัวตัดสิน
# 1.75rem/600 ดันให้มันอยู่ต่ำกว่าเลข 34px บนการ์ดของแท็บที่รื้อแล้วตามลำดับในระบบดีไซน์
metricValueFontSize = "1.75rem"
metricValueFontWeight = 600

# ฟอนต์โหลดจาก Google Fonts โดยแยก subset ไทยกับละตินตามที่ Google ตัดมา
# ต้องประกาศทั้งสอง subset ต่อหนึ่งน้ำหนัก ไม่งั้นตัวอักษรอีกชุดจะตกไปใช้ฟอนต์สำรอง
