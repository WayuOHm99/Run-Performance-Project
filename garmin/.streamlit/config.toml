# ธีมแดชบอร์ด — ตั้งเป็น "สว่าง" ถาวร (ไม่ตามธีมมืดของ OS/เบราว์เซอร์)
# เหตุผล: ตาราง st.dataframe วาดบน <canvas> ตามสีธีม ถ้าเป็นธีมมืดจะพิมพ์ออกมาพื้นมืด/ตัวจาง
# แก้ด้วย print CSS ไม่ได้ (แก้พิกเซลใน canvas ไม่ได้) — พื้นขาวจึงพิมพ์สะอาดทั้งตารางและกราฟ
[theme]
base = "light"
primaryColor = "#2a78d6"
textColor = "#31333F"

# --- ระบบดีไซน์รอบ Garmin-only (30 ก.ย. 69) ---
# ใช้ component ของ Streamlit ตรง ๆ แทนการ์ด HTML ที่เขียนเอง — หน้าตามาจากธีมนี้ที่เดียว
# ฟอนต์ตัวเดียวรองรับทั้งไทยและอังกฤษ ตัวเลขใน st.metric ถูกชี้เป็น mono ด้วย CSS ใน dashboard.py
font = "IBM Plex Sans Thai"
headingFont = "IBM Plex Sans Thai"
codeFont = "IBM Plex Mono"

# การ์ดมนเล็กน้อย เส้นขอบจาง พื้นรองเทาอมฟ้า — ให้ตัวเลขเป็นพระเอก ไม่ใช่กรอบ
baseRadius = "0.75rem"
borderColor = "#e5e7eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6f9"

# สีกราฟ: น้ำเงิน↔ส้มผ่านการตรวจตาบอดสีแล้ว (ΔE 24.7) — กราฟทุกใบเป็น st.line_chart /
# st.bar_chart จึงรับสีจากที่นี่ที่เดียว สองสีท้ายเลี่ยงเขียว/เหลืองซึ่งเป็นสีสถานะ
chartCategoricalColors = ["#2a78d6", "#eb6834", "#104281", "#86b6ef"]
# Streamlit บังคับ **10 ค่าพอดี** สำหรับ sequential/diverging (app_session.py: required_length=10)
# ใส่ 7 ค่าแล้วมันจะ log error ทุกครั้งที่เปิดหน้าและถอยไปใช้สีเริ่มต้นแทน
chartSequentialColors = ["#eaf2fd", "#cde2fb", "#aed0f7", "#9ec5f4", "#6da7ec",
                         "#3987e5", "#2a78d6", "#1c5cab", "#164a8f", "#104281"]

# ตัวเลขใน st.metric ขนาดกลาง — ค่าเริ่มต้นใหญ่เกินเมื่อวางหลายใบในการ์ดเดียว
metricValueFontSize = "1.6rem"
metricValueFontWeight = 600

# ฟอนต์โหลดจาก Google Fonts โดยแยก subset ไทยกับละตินตามที่ Google ตัดมา
# ต้องประกาศทั้งสอง subset ต่อหนึ่งน้ำหนัก ไม่งั้นตัวอักษรอีกชุดจะตกไปใช้ฟอนต์สำรอง
