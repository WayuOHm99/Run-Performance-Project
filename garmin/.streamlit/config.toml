# ธีมแดชบอร์ด — ตั้งเป็น "สว่าง" ถาวร (ไม่ตามธีมมืดของ OS/เบราว์เซอร์)
# เหตุผล: ตาราง st.dataframe วาดบน <canvas> ตามสีธีม ถ้าเป็นธีมมืดจะพิมพ์ออกมาพื้นมืด/ตัวจาง
# แก้ด้วย print CSS ไม่ได้ (แก้พิกเซลใน canvas ไม่ได้) — พื้นขาวจึงพิมพ์สะอาดทั้งตารางและกราฟ
[theme]
base = "light"
primaryColor = "#1d63dc"
textColor = "#18181b"

# --- ระบบดีไซน์ Garmin-only (อัปเกรดโทน SaaS Slate/Zinc) ---
# ใช้ component ของ Streamlit ตรง ๆ คู่กับโทเคนธีมมาตรฐานของ Streamlit 1.67
# ฟอนต์ตัวเดียวรองรับทั้งไทยและอังกฤษ ตัวเลขใน st.metric ถูกชี้เป็น mono ด้วย CSS ใน dashboard.py
font = "IBM Plex Sans Thai"
headingFont = "IBM Plex Sans Thai"
codeFont = "IBM Plex Mono"
headingFontSizes = ["1.75rem", "1.15rem", "1.0rem"]
headingFontWeights = [700, 600, 600]

# การ์ดมนพอดี เส้นขอบคมสะอาด ลดช่องว่างด้านบนไม่ให้เสียพื้นที่จอแรก
baseRadius = "0.75rem"
buttonRadius = "0.55rem"
paddingTop = "2.1rem"
paddingBottom = "2.75rem"
borderColor = "#e2e8f0"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5f9"
dataframeBorderColor = "#e2e8f0"
dataframeHeaderBackgroundColor = "#f8fafc"
dataframeHeaderTextColor = "#475569"

# สีกราฟ: น้ำเงิน↔ส้มผ่านการตรวจตาบอดสีแล้ว (ΔE 24.7) — สองสีท้ายเลี่ยงเขียว/เหลืองซึ่งเป็นสีสถานะ
chartCategoricalColors = ["#1d63dc", "#eb6834", "#0f3a7d", "#7cb2f4"]
# Streamlit บังคับ **10 ค่าพอดี** สำหรับ sequential/diverging (app_session.py: required_length=10)
# ใส่ 7 ค่าแล้วมันจะ log error ทุกครั้งที่เปิดหน้าและถอยไปใช้สีเริ่มต้นแทน
chartSequentialColors = ["#eff6ff", "#dbeafe", "#bfdbfe", "#93c5fd", "#60a5fa",
                         "#3b82f6", "#1d63dc", "#1d4ed8", "#1e40af", "#0f3a7d"]

# ตัวเลขใน st.metric ขนาดกระชับสมดุลเมื่อวางหลายใบในการ์ดเดียว
metricValueFontSize = "1.55rem"
metricValueFontWeight = 600

# ฟอนต์โหลดจาก Google Fonts โดยแยก subset ไทยกับละตินตามที่ Google ตัดมา
