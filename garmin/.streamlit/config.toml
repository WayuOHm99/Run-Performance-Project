# ต้องระบุ textColor ของ sidebar ตรงๆ — ป้องกัน console warning เมื่อกำหนดธีมเอง
[theme.sidebar]
backgroundColor = "#f8f9fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#0b1220"
borderColor = "#e4e7ec"
showWidgetBorder = true

# Health and activity data is private. Bind only to this computer unless an
# authenticated reverse proxy is deliberately configured in front of Streamlit.
# ซ่อนปุ่ม Deploy และเมนูนักพัฒนา — แอปนี้เปิดดูในเครื่องอย่างเดียว
[client]
toolbarMode = "minimal"

[server]
address = "127.0.0.1"
