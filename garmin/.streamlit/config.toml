# ธีมแดชบอร์ด — ตั้งเป็น "สว่าง" ถาวร (ไม่ตามธีมมืดของ OS/เบราว์เซอร์)
# เหตุผล: ตาราง st.dataframe วาดบน <canvas> ตามสีธีม ถ้าเป็นธีมมืดจะพิมพ์ออกมาพื้นมืด/ตัวจาง
# แก้ด้วย print CSS ไม่ได้ (แก้พิกเซลใน canvas ไม่ได้) — พื้นขาวจึงพิมพ์สะอาดทั้งตารางและกราฟ
[theme]
base = "light"
primaryColor = "#155eef"
textColor = "#0b1220"

# --- ระบบดีไซน์ Garmin-only (Executive Editorial Light) ---
# ใช้ component ของ Streamlit ตรง ๆ คู่กับโทเคนธีมมาตรฐานของ Streamlit 1.67
# ฟอนต์ตัวเดียวรองรับทั้งไทยและอังกฤษ ตัวเลขใน st.metric ถูกชี้เป็น mono ด้วย CSS ใน dashboard.py
font = "IBM Plex Sans Thai"
headingFont = "IBM Plex Sans Thai"
codeFont = "IBM Plex Mono"
headingFontSizes = ["1.62rem", "1.06rem", "0.95rem"]
headingFontWeights = [700, 600, 600]

# การ์ดขอบคมพอดี เส้นขอบบางสะอาด พื้นหลังแยกชั้นนุ่มตา
baseRadius = "0.75rem"
buttonRadius = "0.5rem"
paddingTop = "1.6rem"
paddingBottom = "2.5rem"
borderColor = "#e4e7ec"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f6f8"
dataframeBorderColor = "#e4e7ec"
dataframeHeaderBackgroundColor = "#f9fafb"
dataframeHeaderTextColor = "#344054"

# สีกราฟ: แซฟไฟร์ ↔ คอปเปอร์ ↔ ทีล แยกเส้นชัดเจนและผ่านการตรวจตาบอดสี
chartCategoricalColors = ["#155eef", "#d95d24", "#0d9488", "#0b2545"]
# Streamlit บังคับ **10 ค่าพอดี** สำหรับ sequential/diverging (app_session.py: required_length=10)
# ใส่ 7 ค่าแล้วมันจะ log error ทุกครั้งที่เปิดหน้าและถอยไปใช้สีเริ่มต้นแทน
chartSequentialColors = ["#eff4ff", "#d1e0ff", "#b2ccff", "#84adff", "#528bff",
                         "#2970ff", "#155eef", "#004eeb", "#00359e", "#0b2545"]

# ตัวเลขใน st.metric ขนาดกระชับสมดุลเมื่อวางหลายใบในแถวเดียว
metricValueFontSize = "1.5rem"
metricValueFontWeight = 600

# ฟอนต์โหลดจาก Google Fonts โดยแยก subset ไทยกับละตินตามที่ Google ตัดมา
