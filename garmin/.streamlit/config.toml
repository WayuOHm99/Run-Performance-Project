# ธีมแดชบอร์ด — ตั้งเป็น "สว่าง" ถาวร (ไม่ตามธีมมืดของ OS/เบราว์เซอร์)
# เหตุผล: ตาราง st.dataframe วาดบน <canvas> ตามสีธีม ถ้าเป็นธีมมืดจะพิมพ์ออกมาพื้นมืด/ตัวจาง
# แก้ด้วย print CSS ไม่ได้ (แก้พิกเซลใน canvas ไม่ได้) — พื้นขาวจึงพิมพ์สะอาดทั้งตารางและกราฟ
[theme]
base = "light"
primaryColor = "#2a78d6"
textColor = "#31333F"

# ต้องระบุ textColor ของ sidebar ตรงๆ — Streamlit 1.59 มีบั๊ก: ถ้าตั้งธีมเองแต่ไม่กำหนด
# ค่านี้ frontend จะได้สตริงว่างแล้วสแปม console warning "Invalid color passed for textColor"
[theme.sidebar]
textColor = "#31333F"

# Health and activity data is private.  Bind only to this computer unless an
# authenticated reverse proxy is deliberately configured in front of Streamlit.
[server]
address = "127.0.0.1"
