[project]
name = "run-performance-garmin"
version = "0.1.0"
description = "Garmin Connect sync tools for Run-Performance-Project (fetch -> SQLite -> Streamlit dashboard)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "garminconnect==0.3.11",
    "streamlit>=1.59.2",
    "pandas>=3.0.3",
    "plotly>=6.9.0",
]

[dependency-groups]
ci = [
    "playwright==1.63.0",
    "pip-audit==2.10.1",
]

[tool.uv]
package = false
