[project]
name = "run-performance-garmin"
version = "0.1.0"
description = "Garmin Connect sync tools for Run-Performance-Project (fetch -> SQLite -> Streamlit dashboard)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "garminconnect==0.3.20",
    "streamlit>=1.67.0",
    "pandas>=3.1.1",
    "altair>=6.3.0",
]

[dependency-groups]
ci = [
    "playwright==1.65.0",
    "pip-audit==2.10.1",
]

[tool.uv]
package = false
