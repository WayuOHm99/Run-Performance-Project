name: CI

# push ต้องกรองเฉพาะ main — ถ้าปล่อยว่าง commit เดียวกันจะรันสองรอบ (รอบ push +
# รอบ pull_request) เปลืองเวลาเท่าตัวและเจอ flake ของ Windows runner สองเท่า
# branch งานได้ CI จากรอบ pull_request อยู่แล้ว ส่วน main ได้จากรอบ push ตอน merge
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# push ตามมาติด ๆ ระหว่างทำงานบน branch เดียว ไม่จำเป็นต้องรันให้จบทุกรอบ
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (unittest + py_compile + isolation)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: garmin
    env:
      GARMIN_DATA_DIR: ${{ github.workspace }}/garmin-data-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.19"

      - name: Sync dependencies (frozen — no re-resolve)
        run: uv sync --frozen

      - name: Prepare isolated GARMIN_DATA_DIR
        run: mkdir -p "$GARMIN_DATA_DIR"

      - name: Plant canary file in garmin/data (isolation baseline)
        run: |
          mkdir -p data
          echo "ci-canary-${{ github.run_id }}-${{ github.run_attempt }}" > data/ci-canary.txt
          echo "CANARY_HASH=$(sha256sum data/ci-canary.txt | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Run unittest suite (discovered dynamically)
        run: uv run --frozen python -m unittest discover -s tests -v

      - name: Verify garmin/data canary untouched
        run: |
          AFTER_HASH=$(sha256sum data/ci-canary.txt | cut -d' ' -f1)
          if [ "$AFTER_HASH" != "$CANARY_HASH" ]; then
            echo "::error::garmin/data/ci-canary.txt changed during the test run — a test wrote to the production data path instead of GARMIN_DATA_DIR."
            exit 1
          fi
          echo "Canary unchanged ($AFTER_HASH) — garmin/data was not written to."

      - name: Verify no other files appeared in garmin/data
        run: |
          EXTRA=$(find data -type f ! -name ci-canary.txt)
          if [ -n "$EXTRA" ]; then
            echo "::error::Unexpected files found in garmin/data after the test run:"
            echo "$EXTRA"
            exit 1
          fi
          echo "No extra files in garmin/data — isolation confirmed."

      - name: Verify no synthetic test slugs leaked into garmin/data
        run: |
          if grep -rlE "athlete-a|athlete-b|athlete-c|zz-synthetic-athlete-do-not-persist" data/ 2>/dev/null; then
            echo "::error::A synthetic test athlete slug was found inside garmin/data — tests are not isolated from production data."
            exit 1
          fi
          echo "No synthetic slugs found in garmin/data."

      - name: py_compile all project Python files
        run: uv run --frozen python -m compileall -q scripts share tests

      - name: Clean up canary
        if: always()
        run: rm -f data/ci-canary.txt

  windows-ops:
    name: Windows ACL and launcher regressions
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: garmin
    env:
      GARMIN_DATA_DIR: ${{ github.workspace }}/garmin-data-ci
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.19"

      - name: Sync locked dependencies
        run: uv sync --frozen

      - name: Match the production timezone
        run: |
          tzutil /s "SE Asia Standard Time"
          if ((tzutil /g) -ne "SE Asia Standard Time") {
            throw "Failed to configure the production timezone"
          }

      - name: Prepare isolated data and production canary
        id: canary
        run: |
          New-Item -ItemType Directory -Force -Path $env:GARMIN_DATA_DIR, 'data' | Out-Null
          "ci-canary-${{ github.run_id }}-${{ github.run_attempt }}" | Set-Content data/ci-canary.txt
          $hash = (Get-FileHash data/ci-canary.txt -Algorithm SHA256).Hash
          "CANARY_HASH=$hash" >> $env:GITHUB_ENV

      - name: Run full unittest suite including Windows regressions
        run: uv run --frozen python -m unittest discover -s tests -v

      - name: Verify production data untouched
        if: always() && steps.canary.outcome == 'success'
        run: |
          $hash = (Get-FileHash data/ci-canary.txt -Algorithm SHA256).Hash
          if ($hash -ne $env:CANARY_HASH) { throw 'Production canary changed during tests' }
          $extra = Get-ChildItem data -File -Recurse | Where-Object Name -ne 'ci-canary.txt'
          if ($extra) { throw 'Tests created files in production data' }

      - name: Compile all project Python files
        run: uv run --frozen python -m compileall -q scripts share tests

      - name: Clean up canary
        if: always()
        run: Remove-Item data/ci-canary.txt -ErrorAction SilentlyContinue

  dashboard-and-dependencies:
    name: Dashboard browser and dependency checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: garmin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.19"

      - name: Install locked CI tools
        run: uv sync --frozen --group ci

      - name: Audit locked runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --output-file "$RUNNER_TEMP/garmin-requirements.txt"
          uv run --frozen --group ci pip-audit --disable-pip --no-deps --require-hashes --strict --progress-spinner off --cache-dir "$RUNNER_TEMP/pip-audit" -r "$RUNNER_TEMP/garmin-requirements.txt"

      - name: Install Chromium
        run: uv run --frozen --group ci playwright install --with-deps chromium

      - name: Check all dashboard pages with synthetic data
        run: uv run --frozen --group ci python tests/browser_smoke.py --artifacts-dir "$RUNNER_TEMP/dashboard-smoke"

      - name: Save browser diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dashboard-smoke
          path: ${{ runner.temp }}/dashboard-smoke
          if-no-files-found: ignore
          retention-days: 7
