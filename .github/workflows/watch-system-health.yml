name: Watch local system heartbeat

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force_failure:
        description: Test incident delivery without changing heartbeat data
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: watch-system-health
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted validator
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Download privacy-safe heartbeat
        id: download
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release download system-health
          --repo "$GITHUB_REPOSITORY"
          --pattern system-health.json
          --dir "$RUNNER_TEMP"

      # exit 2 = "เงียบแต่ยังไม่ตัดสิน" (โน้ตบุ๊กอาจหลับอยู่) ซึ่งต้องแยกจาก exit 1 ให้ได้
      # แต่ steps.<id>.outcome บอกได้แค่ success/failure จึงต้องส่ง exit code ออกมาเอง
      - name: Validate heartbeat
        id: validate
        if: always()
        continue-on-error: true
        run: |
          set +e
          python garmin/scripts/validate_system_heartbeat.py \
            "$RUNNER_TEMP/system-health.json" \
            --timezone Asia/Bangkok \
            --offline-start 01:00 \
            --offline-end 08:00 \
            --incident-after-hours 12
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Decide the incident verdict
        id: verdict
        if: always()
        env:
          FORCED: ${{ inputs.force_failure }}
          DOWNLOAD: ${{ steps.download.outcome }}
          CODE: ${{ steps.validate.outputs.code }}
        run: |
          if [ "$FORCED" = "true" ] || [ "$DOWNLOAD" != "success" ] \
             || [ -z "$CODE" ] || [ "$CODE" = "1" ]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
          elif [ "$CODE" = "2" ]; then
            echo "status=quiet" >> "$GITHUB_OUTPUT"
          else
            echo "status=healthy" >> "$GITHUB_OUTPUT"
          fi

      # quiet = ไม่แตะ incident เลย ทั้งไม่เปิดใหม่และไม่ปิดของเดิม — ปิดให้เท่ากับ
      # โกหกว่า "recovered" ทั้งที่ยังไม่มี heartbeat ใหม่มายืนยันสักรอบ
      - name: Open or recover the system incident
        if: always() && steps.verdict.outputs.status != 'quiet'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEARTBEAT_STATUS: ${{ steps.verdict.outputs.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python garmin/scripts/heartbeat_issue_alert.py
          --status "$HEARTBEAT_STATUS"
          --repository "$GITHUB_REPOSITORY"
          --run-url "$RUN_URL"

      - name: Fail after incident delivery
        if: always() && steps.verdict.outputs.status == 'failure'
        run: exit 1
