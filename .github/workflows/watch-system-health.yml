name: Watch local system heartbeat

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watch-system-health
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted validator
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Download privacy-safe heartbeat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release download system-health
          --repo "$GITHUB_REPOSITORY"
          --pattern system-health.json
          --dir "$RUNNER_TEMP"

      - name: Require a fresh healthy report
        run: >-
          python garmin/scripts/validate_system_heartbeat.py
          "$RUNNER_TEMP/system-health.json"
          --timezone Asia/Bangkok
          --offline-start 01:00
          --offline-end 08:00
